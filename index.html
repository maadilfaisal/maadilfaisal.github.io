<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg-start: #f8fafc;
    --bg-end: #eef2f7;
    --card: rgba(255, 255, 255, 0.78);
    --border: rgba(148, 163, 184, 0.18);
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0f766e;
    --accent-soft: #14b8a6;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    --shadow-hover: 0 14px 36px rgba(15, 23, 42, 0.12);
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(circle at top, rgba(20, 184, 166, 0.06), transparent 34%),
      linear-gradient(135deg, var(--bg-start), var(--bg-end));
    color: var(--text);
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  body::-webkit-scrollbar,
  html::-webkit-scrollbar {
    display: none;
  }

  body.loading {
    overflow: hidden;
  }

  #particles-js {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.35;
  }

  section {
    position: relative;
    z-index: 1;
    pointer-events: none;
  }

  .content-container, .container {
    pointer-events: auto;
  }

  .section-title {
    letter-spacing: -0.03em;
    color: #0f172a;
  }

  .glass-card,
  .about-card,
  .education-card,
  .skills-card,
  .contact-card {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease, background-color 0.22s ease;
  }

  .glass-card:hover,
  .about-card:hover,
  .education-card:hover,
  .skills-card:hover,
  .contact-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(20, 184, 166, 0.22);
  }

  #home {
    min-height: 100vh;
    padding: 5rem 1.5rem 3rem;
  }

  #home img {
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.16);
    border: 4px solid rgba(255, 255, 255, 0.9);
  }

  #home h1 {
    font-family: 'Inter', sans-serif;
    letter-spacing: -0.04em;
    text-shadow: none !important;
  }

  #home p {
    color: var(--muted);
  }

  #socials-container a {
    width: 2.75rem;
    height: 2.75rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(148, 163, 184, 0.18);
    color: var(--accent);
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, color 0.18s ease;
  }

  #socials-container a:hover {
    transform: translateY(-2px);
    background: white;
    color: var(--accent-soft);
  }

  .skills-card, .contact-card {
    border-radius: 1.25rem;
  }

  .skills-card i,
  .contact-card i {
    color: var(--accent-soft);
  }

  .skills-card h3,
  .education-card h3,
  .contact-card h3 {
    color: #0f172a;
  }

  .skill-item,
  .education-card p,
  .about-card p {
    color: var(--muted);
  }

  .contact-card {
    min-height: 170px;
  }

  .contact-card:hover i,
  .skills-card:hover i,
  .education-card:hover img {
    transform: scale(1.02);
  }

  .contact-card i,
  .skills-card i,
  .education-card img {
    transition: transform 0.22s ease;
  }

  .about-card {
    border-radius: 1.5rem;
  }

  .about-card p {
    line-height: 1.8;
  }

  #preloader {
    transition: opacity 0.5s ease, visibility 0.5s ease;
    background: linear-gradient(135deg, #f8fafc, #eef2f7);
  }

  #preloader.preloader-hidden {
    opacity: 0;
    visibility: hidden;
  }

  .welcome-container {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 12vw, 5rem);
    letter-spacing: 0.18em;
    color: var(--accent);
    display: flex;
    justify-content: center;
  }

  .welcome-container span {
    display: inline-block;
    opacity: 0;
    transform: translateY(16px);
    animation: revealLetter 0.45s forwards;
  }

  .welcome-container span:nth-child(1) { animation-delay: 0.05s; }
  .welcome-container span:nth-child(2) { animation-delay: 0.1s; }
  .welcome-container span:nth-child(3) { animation-delay: 0.15s; }
  .welcome-container span:nth-child(4) { animation-delay: 0.2s; }
  .welcome-container span:nth-child(5) { animation-delay: 0.25s; }
  .welcome-container span:nth-child(6) { animation-delay: 0.3s; }
  .welcome-container span:nth-child(7) { animation-delay: 0.35s; }

  @keyframes revealLetter {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  #slow-load-message {
    color: var(--accent);
    font-size: 0.875rem;
    opacity: 0;
    transition: opacity 0.35s ease-in-out;
  }

  #slow-load-message.visible {
    opacity: 1;
  }

  #humor-modal {
    transition: opacity 0.25s ease;
  }

  #chat-widget-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10000;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  #chat-window {
    display: none;
    flex-direction: column;
    width: 350px;
    height: 500px;
    max-height: 80vh;
    background: white;
    border-radius: 18px;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.16);
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.18);
    margin-bottom: 15px;
  }

  #chat-messages {
    flex-grow: 1;
    padding: 16px;
    overflow-y: auto;
    background: #f8fafc;
  }

  .message {
    margin-bottom: 12px;
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.45;
  }

  .message.user {
    background: var(--accent);
    color: white;
    align-self: flex-end;
    margin-left: auto;
    border-bottom-right-radius: 3px;
  }

  .message.bot {
    background: #e2e8f0;
    color: #0f172a;
    align-self: flex-start;
    border-bottom-left-radius: 3px;
  }

  .message.system {
    background: #fee2e2;
    color: #991b1b;
    align-self: center;
    text-align: center;
    font-size: 0.8rem;
    max-width: 90%;
  }

  .typing-indicator span {
    display: inline-block;
    width: 6px;
    height: 6px;
    background-color: #94a3b8;
    border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out both;
    margin: 0 1px;
  }

  .typing-indicator span:nth-child(1) { animation-delay: -0.24s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.12s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  @media (max-width: 768px) {
    #home {
      padding-top: 4.5rem;
    }

    #chat-window {
      width: calc(100vw - 2rem);
      height: 70vh;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
